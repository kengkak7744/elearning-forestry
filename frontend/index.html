<!doctype html>
<html lang="th">
  <head>
    <!-- charset MUST be first in <head> so the parser locks encoding before any byte content -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#085041" />
    <!-- Root path without the /elearning/ prefix — Vite rebases root-relative
         URLs in index.html with `base` itself (dev and build), so hardcoding
         the prefix produced /elearning/elearning/... -->
    <link rel="icon" type="image/png" href="/forest_logo.png" />
    <!-- LCP image preload for the unauthenticated entry pages (Login,
         Register, Verify). fetchpriority works in Chrome/Edge but Safari
         ignores it; this preload covers all browsers. -->
    <link
      rel="preload"
      as="image"
      href="/forest_logo.png"
      fetchpriority="high"
    />

    <!-- Internal staff system — do NOT index in public search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://wildfire.forest.go.th/elearning/" />

    <title>ระบบ e-Learning กรมป่าไม้</title>
    <meta
      name="description"
      content="ระบบ e-Learning สำหรับเจ้าหน้าที่กรมป่าไม้ — หลักสูตรอบรม ทดสอบ และติดตามความคืบหน้าการเรียนรู้ออนไลน์"
    />

    <!-- Open Graph / link previews (Line, Slack, Teams, Facebook).
         These render even without indexing — the share-preview crawler hits the
         URL directly when a user pastes the link, regardless of robots meta. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wildfire.forest.go.th/elearning/" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:site_name" content="ระบบ e-Learning กรมป่าไม้" />
    <meta property="og:title" content="ระบบ e-Learning กรมป่าไม้" />
    <meta
      property="og:description"
      content="ระบบ e-Learning สำหรับเจ้าหน้าที่กรมป่าไม้ — หลักสูตรอบรม ทดสอบ และติดตามความคืบหน้าการเรียนรู้ออนไลน์"
    />
    <meta property="og:image" content="https://wildfire.forest.go.th/elearning/forest_logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ระบบ e-Learning กรมป่าไม้" />
    <meta
      name="twitter:description"
      content="ระบบ e-Learning สำหรับเจ้าหน้าที่กรมป่าไม้: หลักสูตรอบรม แบบทดสอบ และติดตามความคืบหน้าการเรียน"
    />
    <meta name="twitter:image" content="https://wildfire.forest.go.th/elearning/forest_logo.png" />

    <!-- Font: preconnect so the TCP/TLS handshake overlaps with HTML parse,
         then load via <link> (not CSS @import) so the preload scanner
         discovers it without waiting for the stylesheet to parse. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- YouTube IFrame embeds (used by video_youtube lesson type) — cheap
         DNS prefetch so the first frame loads faster when a learner opens a
         YouTube lesson. Lighter than preconnect (no handshake) because most
         pageviews don't hit a YouTube lesson at all. -->
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <!-- Weights 400/500/600 only — 300 and 700 are effectively unused (700 had
         a single occurrence, now 600), and each Thai weight is ~30KB of glyphs
         we'd otherwise download for nothing. display=optional avoids late font
         swaps that can move text on slow connections. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=optional"
    />
    <!-- Speculation Rules: prerender likely-next pages on hover so navigation
         feels instant. Chromium-only (Safari/Firefox ignore silently — pure
         progressive enhancement).

         Scope rules:
           - moderate eagerness: kicks in ~200ms into a hover, which catches
             real intent without burning bandwidth on glance-overs.
           - excluded /login, /register, /verify: pre-auth, no value
             prerendering when the user is signed in.
           - excluded /admin/*: pages do non-trivial work on mount (stats
             aggregations, audit log fetches). Prerendering them when not
             clicked wastes a real DB query.
           - excluded /courses/*/learn*: the viewer page initialises a video
             element + poller; prerendering would start playback/progress
             saves for a lesson the user may not actually open.

         Side-effect note: GET API calls inside prerendered pages fire ahead
         of time and ride the auth cookie. All current GETs are idempotent
         and cached server-side, so this is safe. If we ever add a GET with
         side effects (analytics ping, etc.), gate it on
         `document.prerendering` and listen for `prerenderingchange`. -->
    <script type="speculationrules">
    {
      "prerender": [{
        "where": {
          "and": [
            { "href_matches": "/*" },
            { "not": { "href_matches": "/login" } },
            { "not": { "href_matches": "/elearning/login" } },
            { "not": { "href_matches": "/register" } },
            { "not": { "href_matches": "/elearning/register" } },
            { "not": { "href_matches": "/verify*" } },
            { "not": { "href_matches": "/elearning/verify*" } },
            { "not": { "href_matches": "/admin/*" } },
            { "not": { "href_matches": "/elearning/admin/*" } },
            { "not": { "href_matches": "/courses/*/learn*" } },
            { "not": { "href_matches": "/elearning/courses/*/learn*" } }
          ]
        },
        "eagerness": "moderate"
      }]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
