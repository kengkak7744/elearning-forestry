server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression -------------------------------------------------------
    # The SPA bundle is text (JS/CSS/HTML/JSON/SVG). Without gzip nginx ships it
    # raw — e.g. the react-vendor chunk is ~232 KB uncompressed vs ~74 KB
    # gzipped (~3x). gzip_proxied any is required so compression still applies
    # behind the Traefik proxy (proxied requests are otherwise skipped).
    # NB: brotli would shave another ~15-20% but stock nginx:alpine has no
    # ngx_brotli module — adding `brotli on` here would break startup. Enable it
    # at the Traefik/edge layer or via a brotli-enabled nginx image instead.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # --- Security headers --------------------------------------------------
    # The SPA's HTML/JS/CSS are served HERE by nginx, NOT by the FastAPI backend
    # — so the backend's security headers never reach the document that actually
    # boots the app. Set them here too. IMPORTANT nginx semantics: a location
    # that declares ANY add_header drops ALL add_headers inherited from this
    # server block, so the set below is repeated in the asset + index.html
    # locations rather than relying on inheritance.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Fingerprinted build assets: cache forever -------------------------
    # Vite hashes every JS/CSS file (e.g. index-BdtBv_i3.css), so the bytes can
    # never change under a given name. Cache immutably for a year; a new deploy
    # emits new filenames that miss the cache naturally. =404 (not the SPA
    # fallback) so a missing asset never returns HTML with a JS/CSS MIME type.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Public static assets (logo, icons, fonts): not fingerprinted ------
    # Cache a month with background revalidation so a swapped logo isn't pinned
    # for a year but repeat visits still avoid the round trip.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- App shell (SPA) ---------------------------------------------------
    # Client-side routing: unknown paths serve index.html so deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML document — no-cache + the full security header set, including a
    # Content-Security-Policy. Shipped as Report-Only first (the standard CSP
    # rollout): it cannot break the app, so deploy it, confirm zero violations in
    # the browser console, then rename the header to `Content-Security-Policy` to
    # enforce. Mirrors the backend CSP_VALUE with two document-specific additions:
    #   - 'inline-speculation-rules' so the inline <script type="speculationrules">
    #     prerender hint in index.html keeps working under the policy;
    #   - 'unsafe-inline' in style-src covers Radix's runtime inline styles.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'inline-speculation-rules'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
}
